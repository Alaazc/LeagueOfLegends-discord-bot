name: Deploy to AWS EC2

on:
  push:
    branches: [ "main" ] # Triggers when you push to your main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Private Key and Known Hosts
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_rsa
          ${{ secrets.SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.HOST }}
          EC2_USER: ${{ secrets.USERNAME }}
        run: |
          ssh ${EC2_USER}@${EC2_HOST} << 'EOF'
            # Navigate to your application directory on the server
            cd /home/ubuntu/LeagueOfLegends-discord-bot
            
            # Pull the latest changes from GitHub
            git pull origin main
          
            # For Python (discord.py):
            pip install -r requirements
            pkill -f Bot.py || true
            nohup python3 Bot.py > discord.log 2>&1 &
          EOF
